<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Checkout</title>
  <meta name="referrer" content="no-referrer">
  <script src="https://cdn.sell.app/embed/script.js" defer></script>
<link href="https://cdn.sell.app/embed/style.css" rel="stylesheet">
<link rel="icon" href="fav.png" type="image/x-icon">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .sellapp-scope {
      display: none; /* Hide the button visually */
    }
  </style>
</head>
<body>
  <div class="sellapp-scope">
    <a id="auto-sell-btn"
       href="#"
       data-sell-store="60286"
       data-sell-product="293550"
       data-sell-darkmode="true"
       data-sell-theme="eab473"
    </a>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('auto-sell-btn').click();
      }, 0); // Auto-click after 0ms (instantly)
    });
  </script>
</body>
</html>
